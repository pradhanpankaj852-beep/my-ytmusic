<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#050507">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <title>YouTube Music</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Continuous Background Audio Host & Player -->
  <div id="yt-player-host" style="position:fixed;bottom:0;right:0;width:240px;height:240px;transform:scale(0.01);transform-origin:bottom right;pointer-events:none;z-index:-9999;"></div>
  <audio id="bg-audio-anchor" loop playsinline webkit-playsinline style="position:fixed;bottom:-100px;left:-100px;width:1px;height:1px;opacity:0.01;pointer-events:none;"></audio>

  <div class="app-layout">
    <!-- Desktop Side Rail / Navigation -->
    <aside class="sidebar" role="navigation" aria-label="Main Navigation">
      <a href="#home" class="brand">
        <div class="brand-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5,3 19,12 5,21"/>
          </svg>
        </div>
        <span>Music</span>
      </a>

      <nav class="nav-links">
        <a href="#home" class="nav-item active" data-route="home">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span>Home</span>
        </a>
        <a href="#search" class="nav-item" data-route="search">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span>Search</span>
        </a>
        <a href="#library" class="nav-item" data-route="library">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></svg>
          <span>Library</span>
        </a>
      </nav>
    </aside>

    <!-- Main Screens Container -->
    <main class="main-content" role="main">
      <!-- YouTube Music Top Header -->
      <header class="app-header">
        <div class="header-brand">
          <div class="brand-play-badge">
            <svg viewBox="0 0 24 24" fill="white" width="14" height="14">
              <polygon points="6,4 20,12 6,20"/>
            </svg>
          </div>
          <span class="header-title">Music</span>
        </div>
        <div class="header-actions">
          <button id="btn-notifications" class="header-icon-btn focus-ring" aria-label="Notifications" title="Notifications">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
          </button>
          <button id="btn-avatar" class="header-avatar-btn focus-ring" aria-label="API Key & Settings" title="API Key & Settings">
            P
          </button>
        </div>
      </header>

      <div id="screen-home"></div>
      <div id="screen-search" style="display:none;"></div>
      <div id="screen-library" style="display:none;"></div>
    </main>
  </div>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="mobile-nav" role="navigation" aria-label="Mobile Navigation">
    <a href="#home" class="mobile-nav-item active" data-route="home">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>Home</span>
    </a>
    <a href="#search" class="mobile-nav-item" data-route="search">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <span>Search</span>
    </a>
    <a href="#library" class="mobile-nav-item" data-route="library">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></svg>
      <span>Library</span>
    </a>
  </nav>

  <!-- Persistent Bottom Mini-Player (P01) -->
  <div id="mini-player"></div>

  <!-- Application Bootstrap -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
